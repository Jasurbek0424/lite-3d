# GitHub'da Release chiqarilganda paketni npm'ga navbatga qo'yadi (staged publish).
# Versiya siz npmjs.com'da 2FA bilan "Approve" bosganingizdan keyingina ommaga chiqadi.
#
# Kalit (token) kerak emas: npm Trusted Publishing shu repo va shu fayl nomiga bog'langan
# (npmjs.com → lite3d → Settings → Trusted Publisher → GitHub Actions, release.yml).
name: Release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write # npm Trusted Publishing (OIDC) uchun

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      # Teg va package.json versiyasi mos kelmasa, noto'g'ri versiya chiqib ketmasin
      - name: Check tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$expected" != "${{ github.event.release.tag_name }}" ]; then
            echo "Release tag ${{ github.event.release.tag_name }} does not match package.json ($expected)"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run size
      # npm stage 11.15.0 dan boshlab bor; Node 22 bilan kelgan npm undan eski
      - run: npm install -g npm@11
      - run: npm stage publish
