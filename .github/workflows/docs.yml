# main'ga merge (push) bo'lganda: avval CI tekshiruvlari, o'tsa sayt GitHub Pages'ga chiqadi.
# https://jasurbek0424.github.io/lite-3d/
# Bir marta sozlash kerak: Settings → Pages → Source: "GitHub Actions".
name: Deploy docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  deploy:
    needs: checks
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
